name: Release and Publish

on:
  push:
    branches: [release]

# Two releases must never be in flight together. 3.1.5 and 3.2.0 were both
# damaged by the same race: merges seconds apart start one run each, and both
# reach `npm publish` and `git push` at the same time. On 3.2.0 one run pushed
# its changelog commit and the other died rebasing onto it --
# `CONFLICT (content): Merge conflict in docs/CHANGELOG.md` -- so the release
# that published the tarball is the one that failed, and its notes were lost.
#
# cancel-in-progress is false and must stay false. Cancelling a release mid-way
# is the one outcome worse than delaying it: the npm publish, the git tag and
# the GitHub release are three separate steps, and a run killed between them
# leaves a version on the registry with no tag behind it.
#
# This serialises the runs. It does NOT make the second one correct, and the
# rest of the race is deliberately left visible rather than half-fixed: the
# version is chosen by `git log -1` in "Determine version bump type", which
# reads only the tip commit of that run's own checkout. Two merges each with a
# `feat:` tip therefore both compute the same next version from the same base,
# and the queued run will now fail loudly at `npm publish` on a version that
# already exists rather than racing the first one. Making it pick the right
# version means reading the branch tip instead of the pushed SHA, which changes
# what a release builds and belongs in its own change.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Pinned so both publish jobs upgrade to the same npm, which is what supports
# OIDC trusted publishing. Bump in one place.
env:
  NPM_CLI_VERSION: '11.19.0'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      root_changed: ${{ steps.changes.outputs.root_changed }}
      mcp_changed: ${{ steps.changes.outputs.mcp_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect package changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          # On a new branch or force-push the "before" SHA can be all zeros or
          # missing. Fall back to the previous commit so the diff still works.
          if [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No valid before SHA ($BEFORE_SHA); falling back to HEAD~1"
            BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          echo "Comparing $BEFORE_SHA..$AFTER_SHA"
          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Root package = anything outside mcp/ and .github/
          ROOT_CHANGES=$(echo "$CHANGED_FILES" | grep -v "^mcp/" | grep -v "^\.github/" || true)
          if [ -n "$ROOT_CHANGES" ]; then
            echo "root_changed=true" >> "$GITHUB_OUTPUT"
            echo "Root package has changes:"
            echo "$ROOT_CHANGES"
          else
            echo "root_changed=false" >> "$GITHUB_OUTPUT"
            echo "No root package changes detected"
          fi

          # MCP package = anything under mcp/
          MCP_CHANGES=$(echo "$CHANGED_FILES" | grep "^mcp/" || true)
          if [ -n "$MCP_CHANGES" ]; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            echo "MCP package has changes:"
            echo "$MCP_CHANGES"
          else
            echo "mcp_changed=false" >> "$GITHUB_OUTPUT"
            echo "No MCP package changes detected"
          fi

  # The gate that did not exist when 3.2.0 published.
  #
  # Every quality workflow in this repository -- ci, visual, yama-review -- is
  # `pull_request`-only. A push to `release` ran Pages and this file, and this
  # file ran `pnpm lint` and then published. So two PRs that were each green
  # against their own base merged fourteen seconds apart, the combination was
  # never tested anywhere, and 3.2.0 went to npm from a tree whose own unit
  # suite had 49 failures. Nothing was broken; nothing was watching.
  #
  # A separate job rather than more steps inside `release`: `needs` makes the
  # dependency the thing that blocks, so publishing cannot begin until the
  # suite has passed, and a reader can see that from the job graph.
  # Unconditional on purpose. Gating this on `root_changed` would have left the
  # MCP package publishing through an ungated path: `publish-mcp` runs when
  # `needs.release.result` is 'skipped', and a skipped `release` is exactly what
  # an MCP-only push produces -- so the one job this file exists to gate would
  # have sailed past it. Worse, a *failed* verify also renders `release` as
  # 'skipped', so the gate would have opened precisely when it should shut.
  # Running it on every push costs one suite on a push that releases nothing,
  # and removes both holes.
  verify:
    needs: detect-changes
    runs-on: ubuntu-latest
    # Every publish now waits on this job, so a step that hangs would hold the
    # release open indefinitely instead of failing it. Playwright install plus
    # both suites finish in well under half of this.
    timeout-minutes: 30

    # `contents: read` is all this job's own steps need. `actions: write` is here
    # by review decision, not by demonstrated need: the artifact upload and the
    # pnpm store cache were both observed working under `contents: read` alone
    # (ci.yml runs the identical pair and uploaded a 335 MB report on d49920fff).
    # It is granted deliberately and recorded here so the next reader knows this
    # workflow -- which publishes to npm -- can also cancel runs and delete
    # artifacts, and can drop the line if that reach is ever unwanted.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm before node, deliberately: setup-node's `cache: pnpm` resolves the
      # store path by running pnpm, so pnpm has to exist first. `run_install: false`
      # stops action-setup installing before that cache is configured, which would
      # make the cache do nothing on every run.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint (prettier, eslint, event-casing)
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      # The step that would have caught it. scripts/wc-parity/prop-parity.test.ts
      # is a vitest test, and it had been failing on `release` since the merge.
      # The root `check` does not cover the web-component build, which this
      # library also ships; a WC-only type error would reach the registry
      # otherwise.
      - name: Type-check web components
        run: pnpm run check:wc

      - name: Unit tests (vitest)
        run: pnpm run test:unit --run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Integration tests (playwright)
        run: pnpm run test:integration

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # v4 artifacts are immutable, so a fixed name makes the upload fail on
          # a re-run -- which is the one time the report is most wanted.
          name: release-verify-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          # `if: always()` also fires when the job was cancelled or failed before
          # Playwright ran. `warn` is the setting that satisfies both halves of the
          # review on this line: nothing is uploaded when the directory is absent, so
          # there is no empty artifact masquerading as evidence, and the run still
          # says so in the log rather than passing over it in silence. `ignore` hid
          # the diagnosis; `error` would fail a job whose tests never ran.
          if-no-files-found: warn

  release:
    needs: [detect-changes, verify]
    if: needs.detect-changes.outputs.root_changed == 'true'
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install

      # Linting moved to the `verify` job this one now needs, so it gates the
      # publish rather than running beside it.

      - name: Determine version bump type
        id: version-type
        run: |
          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Latest commit: $COMMIT_MSG"

          # Check for BREAKING CHANGE in commit body
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          HAS_BREAKING_CHANGE=false
          if echo "$COMMIT_BODY" | grep -iE "^BREAKING CHANGE:" > /dev/null; then
            HAS_BREAKING_CHANGE=true
          fi

          # Determine version bump based on commit message (with optional Jira prefix like BZ-1234:)
          # Pattern: [JIRA-123: ]feat[!|scope!]: message
          if echo "$COMMIT_MSG" | grep -iE "(^|: )feat(\(.+\))?!?:" > /dev/null; then
            # Check for breaking change indicator (!) or BREAKING CHANGE in body
            if echo "$COMMIT_MSG" | grep -E "feat(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=minor" >> $GITHUB_OUTPUT
              echo "Version bump: MINOR (new feature)"
            fi
          elif echo "$COMMIT_MSG" | grep -iE "(^|: )fix(\(.+\))?!?:" > /dev/null; then
            # Check for breaking change in fix commits
            if echo "$COMMIT_MSG" | grep -E "fix(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change in fix)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (bug fix)"
            fi
          elif echo "$COMMIT_MSG" | grep -iE "(^|: )(build|chore|ci|docs|style|refactor|perf|test)(\(.+\))?!?:" > /dev/null; then
            # Check for breaking change in other commit types
            if echo "$COMMIT_MSG" | grep -E "(build|chore|ci|docs|style|refactor|perf|test)(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (maintenance)"
            fi
          else
            # Default to patch, but check for breaking change
            if [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (default)"
            fi
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and generate changelog
        id: version-bump
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Bump version based on type
          if [ "${{ steps.version-type.outputs.version_type }}" = "major" ]; then
            NEW_VERSION=$(pnpm version major --no-git-tag-version)
          elif [ "${{ steps.version-type.outputs.version_type }}" = "minor" ]; then
            NEW_VERSION=$(pnpm version minor --no-git-tag-version)
          else
            NEW_VERSION=$(pnpm version patch --no-git-tag-version)
          fi

          # Clean up version string (remove 'v' prefix if present)
          NEW_VERSION=$(echo $NEW_VERSION | sed 's/^v//')
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          # Install auto-changelog if not already installed
          if ! command -v auto-changelog &> /dev/null; then
            npm install -g auto-changelog
          fi

          # Ensure docs directory exists
          mkdir -p docs

          # Generate changelog.
          #
          # The `[skip ci]` half is carried over from .auto-changelog rather than
          # dropped. A command-line pattern REPLACES the config one, so filtering
          # only the release commits would have silently retired the existing
          # filter. It currently matches nothing -- no commit subject or body on
          # release carries `[skip ci]`, checked across 400 -- but a filter that
          # matches nothing today is not the same as one that is safe to remove.
          #
          # --ignore-commit-pattern has to be a flag: auto-changelog reads it
          # from argv only, and the same key in .auto-changelog is silently
          # accepted and never applied. Dropping the release commits is what
          # makes a section readable, and it does more than remove one bullet --
          # releaseSummary takes its prose from the newest commit in the
          # release, which is otherwise always the bodiless `chore(release)`
          # commit, so every section rendered empty.
          auto-changelog --config .auto-changelog \
            --ignore-commit-pattern '(\[skip ci\]|^chore\(release\):)'

          # Deliberately NOT formatted. An earlier version of this change ran
          # `prettier --write` here, because the generator's output stopped
          # being prettier-clean once sections carried prose. Prettier does not
          # merely reformat it -- it reads the underscores in prose like
          # `DESIGN_PRINCIPLES ... corrects _to_` as emphasis spanning two lines
          # and rewrites them to `DESIGN*PRINCIPLES ... corrects \_to*`, and it
          # is not idempotent, so every release would corrupt a little more.
          # docs/CHANGELOG.md is in .prettierignore instead.

          # If changelog generation failed, create a basic one
          if [ ! -f "docs/CHANGELOG.md" ]; then
            echo "# Changelog" > docs/CHANGELOG.md
            echo "" >> docs/CHANGELOG.md
            echo "## [${{ steps.version-bump.outputs.new_version }}] - $(date +%Y-%m-%d)" >> docs/CHANGELOG.md
            echo "" >> docs/CHANGELOG.md
            echo "### Changes" >> docs/CHANGELOG.md
            echo "- $(git log -1 --pretty=format:"%s")" >> docs/CHANGELOG.md
          fi

      - name: Build package
        run: |
          pnpm build

      - name: Build web components
        run: pnpm run build:wc

      - name: Stage and commit changes
        run: |
          # Check if there are any changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json
            if [ -f "docs/CHANGELOG.md" ]; then
              git add docs/CHANGELOG.md
            fi
            git commit -m "chore(release): ${{ steps.version-bump.outputs.new_version }}"
          else
            echo "No changes to commit"
          fi

      - name: Verify build artifacts
        run: |
          echo "Checking if dist directory exists..."
          if [ -d "dist" ]; then
            echo "✅ dist directory exists"
            echo "Contents of dist directory:"
            find dist -type f | head -20
            echo "Total files in dist: $(find dist -type f | wc -l)"
          else
            echo "❌ dist directory does not exist"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi

      # BEFORE the publish, deliberately. npm publishes are effectively permanent
      # -- a version cannot be re-published and unpublishing is restricted -- while
      # a commit on `release` is revertible. With publish first, anything that stops
      # this push leaves the registry permanently ahead of the repo, with no tag, no
      # `chore(release)` commit and no GitHub Release naming what shipped.
      #
      # That is not hypothetical: run 33961677670 published 3.4.1 and then failed
      # here with `GH006: Protected branch update failed ... 3 of 3 required status
      # checks are expected`, because `release` requires checks/build/visual with
      # enforce_admins on, and a freshly-created release commit has no check runs.
      # 3.4.1 is on npm today with no trace of it in this repository.
      #
      # Ordering it first cannot make that push succeed -- only a settings change
      # can -- but it makes the failure safe: the run stops before publishing and
      # the registry stays clean. The reverse failure (pushed, then publish fails)
      # leaves a version commit for an unpublished version, which the existing
      # `npm view ... && exit 0` guard below makes safe to resolve by re-running.
      - name: Push changes (without tags)
        run: |
          # Pull latest changes to avoid conflicts
          git fetch origin release

          # Check if we're behind
          if [ $(git rev-list --count HEAD..origin/release) -gt 0 ]; then
            echo "Local branch is behind remote. Attempting to rebase..."
            git rebase origin/release
          fi

          git push origin release

          echo "Successfully pushed changes for version ${{ steps.version-bump.outputs.new_version }}"

      # Tag before the publish, for the same reason the branch push moved above
      # it: a tag is a git write and can be deleted, an npm publish cannot be
      # undone. With both git writes ahead of it, anything that blocks either one
      # stops the run with the registry untouched.
      #
      # This does NOT adopt the review's alternative of returning to publish-first
      # with `git push --atomic origin release <tag>`. Atomicity is between the two
      # git refs; it does nothing about the ordering against npm, and the failure
      # that stranded 3.4.1 was the branch push being REJECTED, which an atomic
      # push would simply extend to the tag as well -- published, with neither ref
      # written.
      #
      # The GitHub Release stays after the publish: it announces a released
      # version, so it should follow the thing it announces.
      - name: Create and push git tag
        run: |
          TAG_NAME="${{ steps.version-bump.outputs.new_version }}"

          # Delete tag if it exists locally
          if git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -d "$TAG_NAME"
          fi

          # Delete tag if it exists remotely
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git push origin ":refs/tags/$TAG_NAME"
          fi

          # Create new tag
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

          # Push the tag
          git push origin "$TAG_NAME"

          echo "Successfully created and pushed tag $TAG_NAME"

      - name: Upgrade npm for OIDC trusted publishing
        run: npx -y npm@${NPM_CLI_VERSION} install -g npm@${NPM_CLI_VERSION}

      - name: Publish to NPM
        run: |
          # No token: npm >=11.15 exchanges this workflow's OIDC token for a
          # short-lived publish credential itself, via the trusted-publisher
          # config on npmjs.com for this repo + this workflow file.

          # Check if this version already exists on NPM
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"

          echo "Checking if $PACKAGE_NAME@$NEW_VERSION already exists..."
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null; then
            echo "Version $NEW_VERSION already exists on NPM, skipping publish"
            exit 0
          fi

          # Publish to NPM (with organization scope support)
          echo "Publishing $PACKAGE_NAME@$NEW_VERSION to NPM..."
          npm publish --access public --provenance
          echo "Successfully published $PACKAGE_NAME@$NEW_VERSION to NPM"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          tag_name: ${{ steps.version-bump.outputs.new_version }}
          name: Release ${{ steps.version-bump.outputs.new_version }}
          body: |
            ## What's Changed

            See [CHANGELOG.md](https://github.com/juspay/svelte-ui-components/blob/release/docs/CHANGELOG.md) for detailed changes.

            ### Web Components CDN

            ```html
            <!-- Latest (GitHub Pages) -->
            <script type="module" src="https://juspay.github.io/svelte-ui-components/wc/index.js"></script>

            <!-- Pinned to this version (jsDelivr) -->
            <script type="module" src="https://cdn.jsdelivr.net/gh/juspay/svelte-ui-components@${{ steps.version-bump.outputs.new_version }}/dist-wc/index.js"></script>
            ```

            **Full Changelog**: https://github.com/juspay/svelte-ui-components/commits/release
          files: dist-wc/index.js
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp:
    needs: [detect-changes, verify, release]
    # Run when the MCP package changed, after the root job either published or
    # was skipped (i.e. don't run if the root release job actually failed).
    #
    # `verify` is named explicitly rather than inherited through `release`.
    # `always()` means a skipped or failed dependency does not stop this job by
    # itself, and both of those render `needs.release.result` as 'skipped' --
    # so keying only on `release` would let an MCP publish through on a red
    # suite. The gate has to be asserted, not assumed.
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.detect-changes.outputs.mcp_changed == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          # The root release job may have pushed a release commit + tag.
          # Rebase onto it so this job's push isn't rejected.
          git pull origin release --rebase

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Determine MCP version bump type
        id: version-type
        run: |
          # Use the latest non-release commit so the root job's auto "chore(release):"
          # commit doesn't drive the MCP version bump.
          COMMIT_MSG=$(git log --grep="^chore(release):" --invert-grep -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log --grep="^chore(release):" --invert-grep -1 --pretty=format:"%b")
          echo "MCP release driven by commit: $COMMIT_MSG"

          HAS_BREAKING_CHANGE=false
          if echo "$COMMIT_BODY" | grep -iE "^BREAKING CHANGE:" > /dev/null; then
            HAS_BREAKING_CHANGE=true
          fi

          if echo "$COMMIT_MSG" | grep -iE "(^|: )feat(\(.+\))?!?:" > /dev/null; then
            if echo "$COMMIT_MSG" | grep -E "feat(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=minor" >> $GITHUB_OUTPUT
              echo "Version bump: MINOR (new feature)"
            fi
          elif echo "$COMMIT_MSG" | grep -iE "(^|: )fix(\(.+\))?!?:" > /dev/null; then
            if echo "$COMMIT_MSG" | grep -E "fix(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change in fix)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (bug fix)"
            fi
          elif echo "$COMMIT_MSG" | grep -iE "(^|: )(build|chore|ci|docs|style|refactor|perf|test)(\(.+\))?!?:" > /dev/null; then
            if echo "$COMMIT_MSG" | grep -E "(build|chore|ci|docs|style|refactor|perf|test)(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (maintenance)"
            fi
          else
            if [ "$HAS_BREAKING_CHANGE" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "Version bump: MAJOR (breaking change)"
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "Version bump: PATCH (default)"
            fi
          fi

      - name: Bump MCP version
        id: version-bump
        working-directory: mcp
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current MCP version: $CURRENT_VERSION"

          if [ "${{ steps.version-type.outputs.version_type }}" = "major" ]; then
            NEW_VERSION=$(npm version major --no-git-tag-version)
          elif [ "${{ steps.version-type.outputs.version_type }}" = "minor" ]; then
            NEW_VERSION=$(npm version minor --no-git-tag-version)
          else
            NEW_VERSION=$(npm version patch --no-git-tag-version)
          fi

          # npm version prints e.g. "v4.0.1"; strip the leading 'v'
          NEW_VERSION=$(echo $NEW_VERSION | sed 's/^v//')
          echo "New MCP version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build MCP package
        working-directory: mcp
        run: npm run build

      - name: Upgrade npm for OIDC trusted publishing
        run: npx -y npm@${NPM_CLI_VERSION} install -g npm@${NPM_CLI_VERSION}

      - name: Publish MCP to NPM
        id: npm-publish
        working-directory: mcp
        run: |
          # No token: npm >=11.15 exchanges this workflow's OIDC token for a
          # short-lived publish credential itself, via the trusted-publisher
          # config on npmjs.com for this repo + this workflow file.

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"

          echo "Checking if $PACKAGE_NAME@$NEW_VERSION already exists..."
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null; then
            echo "Version $NEW_VERSION already exists on NPM, skipping publish"
            exit 0
          fi

          # Scoped package -> publish publicly
          echo "Publishing $PACKAGE_NAME@$NEW_VERSION to NPM..."
          npm publish --access public --provenance
          echo "Successfully published $PACKAGE_NAME@$NEW_VERSION to NPM"

      - name: Commit and tag MCP release
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          TAG_NAME="mcp-${NEW_VERSION}"

          # Only commit if the version bump produced a change
          if [ -n "$(git status --porcelain mcp/package.json)" ]; then
            git add mcp/package.json
            git commit -m "chore(release): mcp ${NEW_VERSION}"
          else
            echo "No MCP version change to commit"
          fi

          # Recreate the mcp-prefixed tag (prefixed to avoid colliding with the
          # root package's bare version tags).
          if git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -d "$TAG_NAME"
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git push origin ":refs/tags/$TAG_NAME"
          fi
          git tag -a "$TAG_NAME" -m "Release @juspay/svelte-ui-components-mcp $NEW_VERSION"

          # Rebase on any concurrent changes, then push commit + tag
          git fetch origin release
          if [ "$(git rev-list --count HEAD..origin/release)" -gt 0 ]; then
            git rebase origin/release
          fi
          git push origin release
          git push origin "$TAG_NAME"

          echo "Released @juspay/svelte-ui-components-mcp $NEW_VERSION"

      - name: Rollback MCP version on failure
        if: failure() && steps.npm-publish.conclusion == 'failure'
        working-directory: mcp
        run: |
          echo "MCP publish failed, rolling back version change..."
          git checkout -- package.json
          echo "Version rollback completed"
