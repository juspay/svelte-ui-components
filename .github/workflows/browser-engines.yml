name: Firefox and WebKit verification

on:
  # Weekly, Monday 04:30 UTC. Scheduled workflows run from the default branch (release).
  # Run 45125019123 left WebKit with no failures and Firefox with the 5 VoiceOrb audio
  # tests, which the sound server step below fixes. So a red week is news.
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-engines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engines:
    # Pinned, not ubuntu-latest: `playwright install --with-deps` only knows the
    # Ubuntu releases its own version shipped support for. When ubuntu-latest
    # moved to 26.04, @playwright/test 1.60 failed here with "does not support
    # chromium on ubuntu26.04-x64" before a single test ran. Move this together
    # with @playwright/test (and the noble image tag in visual.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      # The runner has no sound server, so Firefox cannot open an audio output and an
      # AudioContext never leaves "suspended": resume() stays pending and the VoiceOrb
      # audio tests see silence. A null sink gives it a device to play into (probe run
      # 45174796424: pending without it, running with it, all 5 VoiceOrb tests pass).
      - name: Start a silent sound server
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null

      - name: Record tested source and browser inventory
        run: |
          mkdir -p engine-evidence
          git rev-parse HEAD > engine-evidence/head.txt
          pnpm exec playwright --version > engine-evidence/playwright.txt
          pnpm exec playwright test --config playwright.engines.config.ts --project=${{ matrix.engine }} --list > engine-evidence/functional-inventory.txt
          pnpm exec playwright test --config playwright.walkthrough.engines.config.ts --project=${{ matrix.engine }} --list > engine-evidence/walkthrough-inventory.txt

      - name: Complete functional suite, no retries
        id: functional
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: engine-evidence/functional.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: engine-evidence/functional-html
        run: pnpm run test:integration:engines --project=${{ matrix.engine }} --workers=2 --retries=0 --reporter=list,json,html

      - name: Complete walkthrough suite, no retries
        if: ${{ !cancelled() && steps.functional.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: engine-evidence/walkthrough.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: engine-evidence/walkthrough-html
        run: pnpm run test:walkthrough:engines --project=${{ matrix.engine }} --workers=1 --retries=0 --reporter=list,json,html

      - name: Upload inventories, results and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ matrix.engine }}-${{ github.sha }}
          path: |
            engine-evidence/
            test-results-engines/
            test-results-walkthrough-engines/
          retention-days: 14
          if-no-files-found: error
