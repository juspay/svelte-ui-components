name: CI

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  # Lint, type-check and vitest. Split from the Playwright suite so they run
  # once rather than once per shard; `checks` below waits on both halves.
  static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install

      - name: Lint (prettier, eslint, event-casing)
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm run test:unit -- --run

  # The Playwright suite, split across parallel runners. Each shard still pays
  # its own install, browser download and app + fixture build (~3 min) before
  # its first test, so adding shards stops paying off quickly; rebalance from
  # the per-shard timings rather than raising the count blindly.
  integration:
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the rest: their results are what the
      # merged report is for.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # A merge gate as of this commit. History, so the next reader doesn't have
      # to reconstruct it: this step was advisory because every run of the job
      # failed every spec with "browserType.launch: Executable doesn't exist" --
      # the browser-install step above simply didn't exist. The "~130 failing
      # specs" that justified continue-on-error was therefore never a regression
      # count; it was an artifact of a missing binary. Once the install landed
      # the suite went green, which is what made a real gate possible.
      #
      # An earlier draft of this comment claimed a specific run of consecutive
      # green builds as the justification. That claim was withdrawn: the very
      # first run with the gate enabled caught a genuinely failing spec, so the
      # number was wrong, and it had been read from the step's `conclusion` --
      # which continue-on-error rewrites to success. `outcome` is the field
      # that survives it. The gate stands on the suite passing now, checked
      # per-run by this step, rather than on a tally nobody can re-derive.
      # `--reporter` replaces the config's list + html pair for this run only:
      # `list` keeps the console output, `blob` is the per-shard form that
      # `integration-report` merges back into one html report.
      - name: Integration tests (playwright, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm run test:integration --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ github.run_attempt }}-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: warn

  # Merges the shards' blob reports into the single `playwright-report`
  # artifact the unsharded job used to upload. Not part of the gate: a failed
  # merge loses the report, not the merge check.
  integration-report:
    needs: integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-${{ github.run_attempt }}-*
          path: all-blob-reports
          merge-multiple: true

      # "Re-run failed jobs" skips the shards that passed, so they upload no
      # blob under the new attempt, and download-artifact cannot reach an
      # earlier attempt's artifacts. The merged report would then cover only
      # the re-run shards, with nothing saying so. Warn rather than fail: the
      # gate is unaffected, only the report is partial. "Re-run all jobs"
      # gives a complete one. SHARD_TOTAL must match the matrix's shardTotal.
      - name: Warn when the report is missing shards
        env:
          SHARD_TOTAL: 4
        run: |
          found=$(find all-blob-reports -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "blob reports: $found of $SHARD_TOTAL"
          if [ "$found" -lt "$SHARD_TOTAL" ]; then
            echo "::warning title=Partial Playwright report::Only $found of $SHARD_TOTAL shard reports were found for attempt ${{ github.run_attempt }}. A partial re-run only reports the re-run shards; use \"Re-run all jobs\" for a complete report."
          fi

      - name: Merge into html report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          # Suffixed with the attempt: v4 artifacts are immutable, so the old
          # fixed name would make a re-run's upload fail.
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14

  # The merge gate. Keeps the old single job's name so the required status
  # check `checks` still means "lint, types, unit and every shard passed". It
  # must run when a dependency failed (`!cancelled()`) and fail itself then: a
  # skipped required check does not block a merge.
  checks:
    needs: [static, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require static checks and every integration shard to pass
        env:
          STATIC: ${{ needs.static.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "static: $STATIC, integration: $INTEGRATION"
          [ "$STATIC" = success ] && [ "$INTEGRATION" = success ]
