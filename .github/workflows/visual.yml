name: Visual Regression

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    # The job runs INSIDE the same image `scripts/visual-test.sh` uses locally.
    # This is the whole design: baselines are only comparable when the renderer
    # is identical, and a bare ubuntu-latest runner does not ship the same fonts
    # or freetype build as this image. Running here rather than on the host is
    # what lets a developer regenerate a baseline on a laptop and have CI agree.
    # Keep this tag and the IMAGE in scripts/visual-test.sh in lockstep with the
    # @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately a check, not `playwright install`. Installing here would
      # download whatever browser the npm package wants and shadow the one the
      # image pins -- turning a loud version mismatch into CI silently
      # rasterising differently from every laptop, which is the exact failure
      # these pinned baselines exist to prevent. The browser must come from the
      # image, so a drift has to fail rather than self-heal.
      - name: Verify the image ships the browser this Playwright expects
        run: |
          location="$(pnpm exec playwright install --dry-run chromium | awk '/Install location/ { print $3; exit }')"
          if [ ! -d "$location" ]; then
            version="$(node -p "require('@playwright/test/package.json').version")"
            echo "::error::@playwright/test $version expects a browser at $location, which this image does not ship. Update the container image tag here, IMAGE in scripts/visual-test.sh, and @playwright/test in package.json together."
            exit 1
          fi

      - name: Visual regression
        run: pnpm exec playwright test --config playwright.visual.config.ts

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          # Contains expected/actual/diff PNG triplets for every mismatch, which
          # is the only practical way to judge whether a diff is a regression or
          # an intended redesign.
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 14
